services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-botlogix}
      POSTGRES_USER: ${POSTGRES_USER:-botlogix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-botlogix}
      TZ: America/Toronto
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-botlogix} -d ${POSTGRES_DB:-botlogix}"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-botlogix}:${POSTGRES_PASSWORD:-botlogix}@postgres:5432/${POSTGRES_DB:-botlogix}
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: 5057
      TRUST_PROXY: "true"
      TZ: America/Toronto
    volumes:
      - ./reports:/app/reports
      - ./themes:/app/themes:ro
    ports:
      - "127.0.0.1:5057:5057"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5057/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    profiles:
      - worker
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-botlogix}:${POSTGRES_PASSWORD:-botlogix}@postgres:5432/${POSTGRES_DB:-botlogix}
      TZ: America/Toronto
    volumes:
      - ./reports:/app/reports
      - ./themes:/app/themes:ro
    command: ["npm", "run", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
